name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # libs/config.ts throws when these are absent in a production build, so CI
      # supplies placeholders. They only need to be well-formed URLs — nothing is
      # contacted at build time. Real values are injected as Docker build args.
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.ci.invalid
      NEXT_PUBLIC_API_GRAPHQL_URL: https://api.ci.invalid/graphql
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      # Matches the Dockerfile. Fails loudly if package.json and yarn.lock drift,
      # which would otherwise only surface as a broken image build at deploy time.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: yarn build
