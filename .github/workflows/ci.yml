name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # libs/config.ts throws when these are absent in a production build, so CI
      # supplies placeholders. They only need to be well-formed URLs — nothing is
      # contacted at build time. Real values are injected as Docker build args.
      #
      # Do NOT set NODE_ENV: production here. yarn 1 reads NODE_ENV directly
      # (cli.js: `this.production = Boolean(getOption('production')) ||
      # process.env.NODE_ENV === 'production' && ...`), so it would install in
      # production mode and skip devDependencies — @types/numeral,
      # @types/apollo-upload-client and friends — making `tsc --noEmit` fail
      # TS7016 on every push. It is also unnecessary: `next build` sets
      # NODE_ENV=production itself, so libs/config.ts already sees production
      # during the Build step.
      NEXT_PUBLIC_API_URL: https://api.ci.invalid
      NEXT_PUBLIC_API_GRAPHQL_URL: https://api.ci.invalid/graphql
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      # Matches the Dockerfile. Fails loudly if package.json and yarn.lock drift,
      # which would otherwise only surface as a broken image build at deploy time.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: yarn build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the exact image the VPS runs, so a broken Dockerfile fails here
      # instead of mid-deploy on the server. deploy.yml waits for the whole CI
      # workflow to succeed, so this job gates production.
      #
      # libs/config.ts throws in a production build when the public API URLs are
      # absent, and Next.js inlines NEXT_PUBLIC_* at build time, so the build
      # args are required -- placeholders are enough, nothing is contacted.
      - name: Build client image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=https://api.ci.invalid
          --build-arg NEXT_PUBLIC_API_GRAPHQL_URL=https://api.ci.invalid/graphql
          --build-arg NEXT_PUBLIC_SITE_URL=https://ci.invalid
          -t kidsgarden-client:ci .
